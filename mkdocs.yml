site_name: "Metodología de la Investigación I"
site_description: "Curso de metodología de la investigación aplicada a la producción musical"
site_author: "José"

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Objetivos: objetivos.md
  - Logros de aprendizaje: logros.md
  - Calendario: calendario.md
  - Bibliografía: bibliografia.md
  - Unidad 1 · Fundamentos:
      - Sesión 01: sesiones/sesion-01.md
      - Sesión 02: sesiones/sesion-02.md
      - Sesión 03: sesiones/sesion-03.md
  - Unidad 2 · Del tema al protocolo:
